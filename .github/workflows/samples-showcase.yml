name: Samples Showcase

# CLIENT-FACING TRANSPARENCY — install the PUBLIC, sha256-verified `sift` engine (the exact binary a
# user gets from install.sh) and run it over our PUBLIC Jenkins Pipeline sample logs, fetched from the
# public coderoast-hub. It renders the honest two-part story: **silent-on-green** (an unchanged log
# raises nothing) and **regression-catch** (a green build vs a failing one surfaces the structural
# regression). NOT a gate — it never blocks a release; it is evidence a prospective user can inspect.
#
# Deliberately runs the PLAIN structural diff — no `--explain`. Narration in CI is a PRIVATE dogfood
# (the glibc-floor + narration-exposure boundary); a public showcase shows the engine's structural
# verdict, not the LLM narrative. An `--explain` variant would be a separate, privately-gated job.
#
# PUBLIC + anonymous: sift-action, the engine asset, and coderoast-hub are all public — no secret to
# install the engine or fetch the samples.

on:
  workflow_dispatch:
    inputs:
      sift_version:
        # NO DEFAULT, deliberately — see the resolve step. A literal here read '1.7.5' while the
        # shipped pin was 1.9.6, so every dispatch that did not name a version rendered the
        # client-facing showcase with an engine two releases old, under a header promising "the
        # exact binary a user gets from install.sh". Empty means "use the pin", which follows
        # bump.sh instead of rotting beside it.
        description: 'Published sift engine version to install (engine-v<X.Y.Z>). Empty = the pin in src/sift-version.ts.'
        required: false
      samples_ref:
        description: 'coderoast-hub ref holding the samples'
        required: false
        default: main
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to attach the showcase bundle to'
        type: string
        required: false
      sift_version:
        # Same as the dispatch input above: no default, so an omitted version resolves to the pin.
        type: string
        required: false
      samples_ref:
        type: string
        required: false
        default: main
  # "or release" — fires however a release is published (the engine-v* ceremony is external to this
  # repo, so the `release` event is the robust hook; a git-tag `push` trigger would miss a gh-created
  # release). On an engine-v<X> release the showcase installs THAT engine; the bundle attaches to it.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  showcase:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach the bundle to the Release (only when a tag is passed)
    steps:
      - uses: actions/checkout@v5   # sift-action itself — install.sh + scripts/samples_showcase.sh

      - name: Fetch the PUBLIC samples from coderoast-hub (public, anonymous)
        uses: actions/checkout@v5
        with:
          repository: CodeRoasted/coderoast-hub
          path: hub
          ref: ${{ inputs.samples_ref || 'main' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install the public sift engine (download + sha256-verify — the honest client path)
        env:
          # dispatch/call → the input when named; release → derived from the tag; otherwise the pin.
          SIFT_VERSION_INPUT: ${{ inputs.sift_version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Resolve the engine version: an explicit input wins; else an engine-v<X> release installs
          # THAT engine; else the PIN — read from src/sift-version.ts, never written here.
          #
          # That last arm used to be the literal '1.7.5', with a comment calling it "the current
          # cut". It was, once. The pin moved to 1.9.6 and this line did not, so every dispatch and
          # every workflow_call that omitted a version rendered the PUBLIC showcase — the artifact a
          # prospective user is invited to inspect, headed "the exact binary a user gets from
          # install.sh" — on an engine two releases behind the one we ship. Three literals said
          # 1.7.5 (both input defaults and this line) and nothing compared any of them to anything.
          #
          # Deriving removes the drift rather than checking for it: src/sift-version.ts is written
          # ONLY by bump.sh, which pins to a PUBLISHED engine, so this arm cannot name a version
          # that does not exist and cannot fall behind the pin. There is no literal left to rot,
          # which is why no new gate is owed here.
          VER="$SIFT_VERSION_INPUT"
          if [ -z "$VER" ]; then
            case "$RELEASE_TAG" in
              engine-v*) VER="${RELEASE_TAG#engine-v}" ;;
              *) VER="$(grep -oE "SIFT_VERSION[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]" src/sift-version.ts \
                        | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)" ;;
            esac
          fi
          # An unparseable pin is a broken instrument, never a reason to install something else:
          # a silent fallback here is exactly how the stale literal survived unnoticed.
          [ -n "$VER" ] || { echo "::error::could not resolve a sift engine version — no input, no engine-v* release tag, and src/sift-version.ts did not parse. Refusing to render a showcase on a guessed engine."; exit 1; }
          echo "sift engine version: $VER"
          # install.sh falls back to ~/.local/bin unless SIFT_INSTALL_DIR already EXISTS + is writable —
          # so create it first, else the binary lands elsewhere than where we look for it.
          mkdir -p "$PWD/bin"
          SIFT_INSTALL_DIR="$PWD/bin" sh install.sh "$VER"
          echo "SIFT=$PWD/bin/sift" >> "$GITHUB_ENV"
          # `--version` here was a no-op with a `|| true` on it: sift has no version flag, so this
          # line printed a usage error and swallowed it. install.sh now proves liveness itself
          # (fatally), so this step no longer needs a probe of its own — and a probe that cannot
          # fail is worse than none.

      - name: Render the Sift-over-Jenkins showcase
        run: bash scripts/samples_showcase.sh "$SIFT" hub/samples showcase

      - name: Bundle + step summary
        run: |
          set -euo pipefail
          tar --sort=name --mtime='2026-01-01 00:00:00Z' --owner=0 --group=0 --numeric-owner \
              -C showcase -czf sift-samples-showcase.tar.gz .
          {
            echo "## Sift over our public Jenkins samples"
            echo
            cat showcase/README.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: sift-samples-showcase
          path: showcase
          if-no-files-found: error

      # Release path (workflow_call with a tag, or the `release` event): attach the bundle to the Release.
      - name: Attach the showcase bundle to the Release
        if: ${{ inputs.tag || github.event.release.tag_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" sift-samples-showcase.tar.gz --clobber
