name: Samples Showcase

# CLIENT-FACING TRANSPARENCY — install the PUBLIC, sha256-verified `sift` engine (the exact binary a
# user gets from install.sh) and run it over our PUBLIC Jenkins Pipeline sample logs, fetched from the
# public coderoast-hub. It renders the honest two-part story: **silent-on-green** (an unchanged log
# raises nothing) and **regression-catch** (a green build vs a failing one surfaces the structural
# regression). NOT a gate — it never blocks a release; it is evidence a prospective user can inspect.
#
# Deliberately runs the PLAIN structural diff — no `--explain`. Narration in CI is a PRIVATE dogfood
# (the glibc-floor + narration-exposure boundary); a public showcase shows the engine's structural
# verdict, not the LLM narrative. An `--explain` variant would be a separate, privately-gated job.
#
# PUBLIC + anonymous: sift-action, the engine asset, and coderoast-hub are all public — no secret to
# install the engine or fetch the samples.

on:
  workflow_dispatch:
    inputs:
      sift_version:
        # NO DEFAULT, deliberately — see the resolve step. A literal here read '1.7.5' while the
        # shipped pin was 1.9.6, so every dispatch that did not name a version rendered the
        # client-facing showcase with an engine two releases old, under a header promising "the
        # exact binary a user gets from install.sh". Empty means "use the pin", which follows
        # bump.sh instead of rotting beside it.
        description: 'Published sift engine version to install (engine-v<X.Y.Z>). Empty = the pin in src/sift-version.ts.'
        required: false
      samples_ref:
        description: 'coderoast-hub ref holding the samples'
        required: false
        default: main
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to attach the showcase bundle to'
        type: string
        required: false
      sift_version:
        # Same as the dispatch input above: no default, so an omitted version resolves to the pin.
        type: string
        required: false
      samples_ref:
        type: string
        required: false
        default: main
  # "or release" — fires however a release is published (the engine-v* ceremony is external to this
  # repo, so the `release` event is the robust hook; a git-tag `push` trigger would miss a gh-created
  # release). On an engine-v<X> release the showcase installs THAT engine; the bundle attaches to it.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # The body is malf's `coderoast-sift-showcase.yml` (ROADMAP N357): this file keeps the triggers and
  # resolves them into its three inputs. A dispatch or call names a version or none (the pin); the
  # `release` event names its tag, which the workflow both attaches to and, for an engine-v<X> tag,
  # installs. `contents: write` is the attach; a called workflow cannot raise it.
  showcase:
    permissions:
      contents: write
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-sift-showcase.yml@f9f7c12294668a7eed9d89f277fab6cf4c8b4a63
    with:
      sift-version: ${{ inputs.sift_version }}
      samples-ref: ${{ inputs.samples_ref || 'main' }}
      release-tag: ${{ inputs.tag || github.event.release.tag_name }}
