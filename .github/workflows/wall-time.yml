# Sift wall time on a GitHub-HOSTED runner — the measurement behind any public speed claim.
#
# `workflow_dispatch` ONLY, deliberately. This is a study instrument, not a gate: it answers
# "how fast is the engine on the hardware a user actually has" once, when someone asks. A
# per-push trigger would spend runner time forever to re-answer a question whose answer only
# moves when the engine does.
#
# ubuntu-latest, never the self-hosted fleet: this repo is PUBLIC, so a fork's dispatch must
# never reach our box, and the number we want is the one a stranger's CI produces — our
# fleet's hardware is not what a claim about "your CI" may be measured on.
#
# `wall-time.json` (uploaded by the malf workflow this file calls) is an artifact of this PUBLIC repo, so whatever the
# ladder puts in it is published. The runner coordinate it attaches is hardware and image
# only — `tools/wall_time_ladder.py` deliberately does not collect `RUNNER_NAME`, which is an
# identifier rather than a coordinate and would have published this fleet's box name the day
# the line above changed. Anything added to that payload is subject to the same reading.
#
# The engine under test is the PUBLISHED pin (scripts/engine_pin.sh -> the release asset),
# not a build from source: a claim about what users get must be measured on what users get.
name: Wall time (manual study)

on:
  workflow_dispatch:
    inputs:
      rungs:
        description: 'Replication factors for the size ladder (comma-separated)'
        default: '1,4,16,64'
        required: false
      reps:
        description: 'Timed repetitions per rung; the MINIMUM is reported'
        default: '5'
        required: false

permissions:
  contents: read

jobs:
  # The body is malf's `coderoast-sift-wall-time.yml` (ROADMAP N357); this file keeps the dispatch
  # and its defaults.
  wall-time:
    uses: CodeRoasted/malf-toolchain/.github/workflows/coderoast-sift-wall-time.yml@e09095c11ee027b08b58476f70c8a1a2e269b159
    with:
      rungs: ${{ inputs.rungs }}
      reps: ${{ inputs.reps }}
