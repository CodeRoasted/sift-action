# Sift wall time on a GitHub-HOSTED runner — the measurement behind any public speed claim.
#
# `workflow_dispatch` ONLY, deliberately. This is a study instrument, not a gate: it answers
# "how fast is the engine on the hardware a user actually has" once, when someone asks. A
# per-push trigger would spend runner time forever to re-answer a question whose answer only
# moves when the engine does.
#
# ubuntu-latest, never the self-hosted fleet: this repo is PUBLIC, so a fork's dispatch must
# never reach our box, and the number we want is the one a stranger's CI produces — our
# fleet's hardware is not what a claim about "your CI" may be measured on.
#
# The engine under test is the PUBLISHED pin (scripts/engine_pin.sh -> the release asset),
# not a build from source: a claim about what users get must be measured on what users get.
name: Wall time (manual study)

on:
  workflow_dispatch:
    inputs:
      rungs:
        description: 'Replication factors for the size ladder (comma-separated)'
        default: '1,4,16,64'
        required: false
      reps:
        description: 'Timed repetitions per rung; the MINIMUM is reported'
        default: '5'
        required: false

permissions:
  contents: read

jobs:
  wall-time:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Runner coordinate (a wall time without its hardware is unfalsifiable)
        run: |
          set -euo pipefail
          echo "=== runner image ==="
          echo "ImageOS=${ImageOS:-unset}  ImageVersion=${ImageVersion:-unset}"
          echo "RUNNER_OS=${RUNNER_OS:-unset}  RUNNER_ARCH=${RUNNER_ARCH:-unset}"
          echo "=== cpu ==="
          nproc
          grep -m1 '^model name' /proc/cpuinfo || true
          grep -c '^processor' /proc/cpuinfo
          echo "=== memory ==="
          grep -E '^(MemTotal|MemAvailable)' /proc/meminfo
          echo "=== disk (the ladder writes ~95 MB of replicated logs) ==="
          df -h /tmp "$RUNNER_TEMP"

      - name: Download the PUBLISHED engine pin (timed — this cost is part of a user's run)
        id: engine
        run: |
          set -euo pipefail
          # Same parse ci.yml's "Engine pin is PUBLISHED" gate uses — one definition, so the
          # binary measured here cannot drift from the binary that gate probes.
          ver="$(scripts/engine_pin.sh)"
          echo "engine pin: $ver"
          base="https://github.com/CodeRoasted/sift-action/releases/download/engine-v$ver"
          mkdir -p "$RUNNER_TEMP/engine"

          # Timed separately from the diff on purpose: the marginal cost a user pays per CI
          # run is the STEP, and the engine download is a fixed ~12.7 MB of it that no amount
          # of engine speed removes. Reporting only the diff time would answer a question
          # nobody asked.
          t0=$(date +%s.%N)
          curl -fsSL "$base/sift-linux-x64" -o "$RUNNER_TEMP/engine/sift"
          t1=$(date +%s.%N)
          curl -fsSL "$base/sift-linux-x64.sha256" -o "$RUNNER_TEMP/engine/sift.sha256"
          t2=$(date +%s.%N)

          bytes=$(stat -c%s "$RUNNER_TEMP/engine/sift")
          echo "binary bytes      : $bytes"
          echo "binary download s : $(echo "$t1 - $t0" | bc)"
          echo "sha256 download s : $(echo "$t2 - $t1" | bc)"
          echo "download MB/s     : $(echo "scale=2; ($bytes/1048576) / ($t1 - $t0)" | bc)"

          # Never time an unverified binary: a proxy's error page would measure as a very
          # fast engine. Same supply-chain rule src/resolve-sift.ts enforces at runtime.
          ( cd "$RUNNER_TEMP/engine" && awk '{print $1"  sift"}' sift.sha256 | sha256sum -c - )
          chmod +x "$RUNNER_TEMP/engine/sift"
          "$RUNNER_TEMP/engine/sift" --version

          # Cold-cache re-download, to answer "is this cached between runs?" with a
          # measurement rather than an assumption. resolve-sift.ts uses no tool-cache, so
          # every consumer run pays this again; if that ever changes, this number moves.
          t3=$(date +%s.%N)
          curl -fsSL "$base/sift-linux-x64" -o /dev/null
          t4=$(date +%s.%N)
          echo "second download s : $(echo "$t4 - $t3" | bc)  (no tool-cache: every run pays it)"

      - name: Fetch the public showcase logs (the same pair the desk ladder used)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          base="https://raw.githubusercontent.com/CodeRoasted/coderoast-hub/main/showcase/sift/logs"
          for f in logcraft__ci-build__green-a.log logcraft__ci-build__green-b.log logcraft__ci-build__red.log; do
            curl -fsSL "$base/$f" -o "$RUNNER_TEMP/logs/$f"
          done
          # Byte sizes are asserted against the desk's, because the ladder's whole value is
          # comparability: a silently different input makes the hosted/desk ratio meaningless.
          ( cd "$RUNNER_TEMP/logs" && sha256sum ./*.log && wc -c ./*.log )

      - name: Size ladder — best-of-N, with the change counts asserted at every rung
        run: |
          set -euo pipefail
          python3 tools/wall_time_ladder.py \
            --engine "$RUNNER_TEMP/engine/sift" \
            --logs "$RUNNER_TEMP/logs" \
            --rungs '${{ inputs.rungs }}' \
            --reps '${{ inputs.reps }}' \
            --json-out "$RUNNER_TEMP/wall-time.json"

      - name: Publish the result set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sift-wall-time
          path: ${{ runner.temp }}/wall-time.json
          if-no-files-found: warn
