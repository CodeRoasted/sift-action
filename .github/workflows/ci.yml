name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write   # Sift dogfood: comment on same-repo PRs + seed on push; fork PRs skipped (read-only token anyway)
      actions: write         # Sift dogfood: upload the baseline-log artifact (+ read for last-green resolution)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          # MUST equal action.yml's `runs: using: nodeNN` — GitHub launches dist/index.js on
          # THAT runtime, so anything proven here on a different major proves nothing about
          # the artifact. This line read '20' against a node24 manifest for ~7 weeks: every
          # step below was green about a bundle that had never executed on its own runtime.
          # Moves together with action.yml, esbuild.config.mjs `target` and package.json
          # `engines.node`; the workspace node-runtime-coherence gate holds the four.
          node-version: '24'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: The runtime we prove on IS the runtime we ship on
        # Six declarations of one fact — action.yml `runs.using`, this workflow's
        # `node-version`, esbuild's `target` and its header prose, `engines.node`, and
        # `@types/node`. They drifted apart for ~7 weeks (manifest node24 / everything else
        # node20) because nothing compared them, and the cost was not theoretical: the suite
        # below had never executed on node24, so when it finally did it died on contact.
        #
        # It runs BEFORE typecheck and test deliberately. Those two steps are what the skew
        # invalidates, and a green from a suite running on the wrong major is worse than no
        # green at all — it is a claim about an artifact nobody measured.
        #
        # `npm run runtime-coherence` is the same entry point a developer uses pre-push, for
        # the reason preflight is: one definition, so local and CI cannot drift into checking
        # different things. `--selftest` proves the extractors have teeth.
        run: |
          set -euo pipefail
          python3 tools/node_runtime_coherence.py --selftest
          npm run runtime-coherence

      - name: Start build-log capture (typecheck/test below append; Sift diffs it)
        run: truncate --size 0 "$GITHUB_WORKSPACE/build.log"

      # `shell: bash` on both steps below is load-bearing, not style. The default runner
      # shell is `bash -e {0}`, and `-e` reads the exit status of a PIPELINE's LAST command
      # — here `tee`, which always succeeds. So `npm test 2>&1 | tee …` reported success no
      # matter what the suite did: these two steps were structurally incapable of failing.
      # `shell: bash` selects `bash --noprofile --norc -eo pipefail {0}`; `pipefail` is the
      # word that matters. Measured 2026-08-22: the node24 move made `npm test` crash before
      # a single assertion ran (0 pass / 1 fail) and this job still reported SUCCESS — the
      # bug was found by reading the log, which is not a control we can rely on.
      - name: Typecheck
        shell: bash
        run: npm run typecheck 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Test
        shell: bash
        run: npm test 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: dist/ is in sync with src/ (the committed bundle is what runs)
        # `runs: main: dist/index.js` — GitHub executes the COMMITTED bundle, not
        # src/. A stale dist silently ships old behaviour, so re-bundle and fail if
        # the committed dist differs. The #1 JS-action footgun; this gate kills it.
        run: |
          npm run package
          if ! git diff --quiet --exit-code dist/; then
            echo "::error::dist/ is stale — run 'npm run package' and commit dist/."
            git --no-pager diff --stat dist/
            exit 1
          fi

      - name: Engine pin is PUBLISHED (the pin's binary + sha256 must both be live)
        # The Action downloads engine-v<SIFT_VERSION>/sift-linux-x64 at runtime, so a pin
        # naming an unpublished release 404s every consumer — and does it silently, because
        # the download sits behind continue-on-error (that is how the live @v1 came to pin a
        # long-dead engine-v1.4.2 while every run looked green).
        #
        # This property used to live on the workspace pin-coherence gate as INV-8, which
        # asserted `pin <= dev baseline` — a proxy, not the property, and one that still
        # admitted a pin ahead of anything actually published. It is checked here instead,
        # against the release list, and on this repo's own push/tag/PR trigger rather than a
        # workspace gate the Action's own changes never fire. bump.sh cannot write an
        # unpublished pin; this is the standing guard against the release being deleted or
        # the pin being hand-edited.
        run: |
          set -euo pipefail
          ver="$(grep -oE "SIFT_VERSION\s*=\s*['\"][^'\"]+['\"]" src/sift-version.ts \
                 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          [ -n "$ver" ] || { echo "::error::could not parse SIFT_VERSION from src/sift-version.ts"; exit 1; }
          echo "engine pin: $ver"
          base="https://github.com/CodeRoasted/sift-action/releases/download/engine-v$ver"
          rc=0
          for suffix in "" ".sha256"; do
            code="$(curl -sSL -o /dev/null -w '%{http_code}' "$base/sift-linux-x64$suffix" || echo 000)"
            if [ "$code" = "200" ]; then
              echo "  ✓ sift-linux-x64$suffix → $code"
            else
              echo "::error::engine-v$ver/sift-linux-x64$suffix is NOT published (HTTP $code) — consumers would 404 at download. Run ./bump.sh to re-pin to a published engine."
              rc=1
            fi
          done
          # The Jenkins example is a recipe users copy verbatim; a stale one installs an old
          # engine. bump.sh moves both together (this is what INV-8b used to assert).
          if [ -f examples/jenkins/Jenkinsfile ]; then
            jver="$(grep -oE "SIFT_VERSION\s*=\s*['\"][0-9.]+['\"]" examples/jenkins/Jenkinsfile \
                    | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
            if [ "$jver" != "$ver" ]; then
              echo "::error::examples/jenkins/Jenkinsfile pins $jver but the Action pins $ver — run ./bump.sh, which rewrites both."
              rc=1
            else
              echo "  ✓ jenkins example agrees ($jver)"
            fi
          fi
          exit $rc

      - name: Preflight — the vector we BUILD runs on the engine we PIN
        # The step above proves the pinned binary EXISTS. This proves it ACCEPTS what we send it.
        # Distinct properties: a published pin still 134s if the Action forwards a token that
        # release predates. Measured three times — `--outcome-vocabulary`, then `--transport none`
        # twice — and every gate above this line went green on all three, because they answer
        # "did it ship" and never "will it run". The unit suite structurally cannot catch it: it
        # asserts the vector's content, and the content was always what we intended.
        #
        # Same script a developer runs pre-push (`npm run preflight`), deliberately: one
        # definition, so local and CI cannot drift into checking different things. It imports the
        # real siftArgs / resolveSift / engineEnv rather than restating them — see tools/preflight.ts
        # for why a hand-rebuilt vector would defeat the purpose.
        run: npm run preflight

      - name: Sift — structural diff of this run's typecheck/test log (advisory, dogfoods THIS code)
        if: ${{ always() && github.event.pull_request.head.repo.fork != true }}
        continue-on-error: true    # advisory: a Sift error must NEVER fail this build
        uses: ./    # the local action (dist/ was just rebuilt above), NOT @v1 — so the PR's own code eats its dog food
        with:
          log: build.log
          fail-on: none
          commit-comment: regression
          changed-outcome: ${{ job.status }}   # the NATIVE token — the engine maps it four-class (ADR 0025)

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: actionlint (PINNED release asset — no remote script is executed)
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          # TWO defects were fixed here, and only the first is about this repo's own gate.
          #
          # 1. SUPPLY CHAIN. This used to be
          #    `curl -sSfL .../actionlint/main/scripts/download-actionlint.bash | bash` — arbitrary
          #    code from a MUTABLE upstream ref, executed on the runner every run. `main` is not a
          #    version: whatever that branch holds at the moment CI fires is what runs. The blast
          #    radius is bounded (this job inherits `contents: read`), but "bounded" is not
          #    "absent", and nothing here needs a remote script at all. Pinning the RELEASE ASSET
          #    removes the execution surface rather than narrowing it, and matches the pattern the
          #    superproject's lint.yml already uses — one shape for actionlint everywhere.
          #
          # 2. Swallowed status, the sibling arm of the Typecheck/Test fix above. Under the
          #    default `bash -e {0}` the pipeline's status was BASH's, and bash fed an EMPTY stdin
          #    exits 0 — measured, `curl -fsSL <404> | bash` → rc=0. A dead download reported a
          #    successful install; the failure surfaced one line later as `./actionlint: No such
          #    file or directory`, a true failure wearing the wrong cause, and only because a
          #    later line happened to touch the artifact. `set -euo pipefail` makes curl's own
          #    status the verdict.
          set -euo pipefail
          curl -sSfL -o /tmp/al.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint --version
          /tmp/actionlint

  manifest-load:
    # actionlint lints WORKFLOWS, not action.yml — so a broken manifest (a ${{ }} expression
    # using a context invalid in action metadata, e.g. `needs` / `github.event`) ships silently
    # and fails EVERY consumer at `uses:`, which the TS suite can never catch. Force GitHub to
    # LOAD the manifest by self-using the action. A manifest that won't load fails this job at
    # the `uses:` step. (PRs are covered by the push:main run after merge, before the floating
    # @v1 is re-pointed at the new commit.)
    #
    # WHAT IT ACTUALLY EXERCISES — corrected 2026-08-10 after the description cost us a red.
    # This comment used to say the job was "seed-only ... no engine, no binary, no comment".
    # That was true when written and stopped being true when baseline storage landed: with a
    # stored baseline this job downloads the pinned engine and runs a REAL comparison. It is
    # the job that caught `--transport none` — while its own description said it could not.
    #
    # That is the expensive kind of stale comment: it does not merely misinform, it argues
    # against consulting the instrument you already have. It is why the bad commit was pushed
    # without anyone running this check first. A comment stating INTENTION rots when the plan
    # moves; a comment stating STATE rots when the SYSTEM moves, silently, and nothing
    # type-checks it.
    #
    # THE PAIR, and why both exist. `preflight` (in `build`, above) and this job guarantee
    # different things, and neither subsumes the other:
    #
    #   preflight     — the argument vector we BUILD runs on the engine we PIN. Runs the real
    #                   siftArgs against the real resolved pin. Runs LOCALLY too, pre-push,
    #                   which is the whole point: it is the only one of the two a developer can
    #                   consult before the mistake is public.
    #   manifest-load — action.yml LOADS at `uses:`, which ONLY GitHub can prove, plus main.ts's
    #                   real orchestration end to end. Post-push by nature.
    #
    # Together: preflight fails fast and early on a vector the pin rejects; this job is the
    # backstop for everything preflight cannot reach — manifest validity, input plumbing, and
    # the `--explain` pair preflight declares out of scope.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: echo "manifest-load smoke" > smoke.log   # a real file for the required `log` input
      - uses: ./
        with:
          log: smoke.log

  windows-install:
    # `OPS-7.S112` cell 1 — THE PUBLICLY DOCUMENTED WINDOWS INSTALL PATH, EXECUTED BY NOTHING.
    #
    # README.md tells a Windows user to run `irm .../install.ps1 | iex`, and resolve-sift.ts
    # tells them the same thing in the error it prints when the Action meets a non-linux
    # runner. That script downloads a published asset, sha256-verifies it fatally, and
    # installs it — and until this job it had never once run. Its Linux twin `install.sh`
    # DOES run (samples-showcase.yml installs the engine with it on every showcase), so the
    # asymmetry was not a policy, just a gap: two sweeps found `install.ps1` referenced only
    # from prose and from bump.sh, which REWRITES it rather than executing it.
    #
    # WINDOWS-LATEST IS FREE HERE and that is why this is affordable. The runner-budget rule
    # is that the self-hosted fleet is ONE box and hosted minutes are scarce — but this repo
    # is PUBLIC (verified 2026-08-24), and GitHub-hosted minutes are not metered on public
    # repos. The same fact is why sift-action must never touch the fleet: a public repo takes
    # fork PRs.
    #
    # THE NEGATIVE ARM IS FIRST, deliberately. A green installer job proves nothing unless the
    # job can go red, and "the download worked" is the easiest can't-FAIL in this file: point
    # it at an engine that will never exist and the script MUST refuse. `0.0.0` is chosen
    # because it is unpublishable by construction (bump.sh derives every pin from the released
    # set), so this control cannot rot into a true positive the way a real-but-old version
    # would. It exercises the exact `Fail` path a broken asset name or a moved release takes.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Arm the installer (it MUST refuse an engine that cannot exist)
        shell: pwsh
        run: |
          # TWO refusal shapes, and catching only one would make this control a coin flip.
          # install.ps1 sets `$ErrorActionPreference = 'Stop'` in its own scope, so its `Fail`
          # helper's `Write-Error` THROWS before ever reaching the `exit 1` beside it — the
          # script normally leaves by exception, not by exit code. Both are a refusal here.
          $ErrorActionPreference = 'Continue'
          $global:LASTEXITCODE = 0
          $refused = $false
          try { & ./install.ps1 -Version 0.0.0 *> $null; if ($LASTEXITCODE -ne 0) { $refused = $true } }
          catch { $refused = $true }
          if (-not $refused) {
            Write-Host "::error::install.ps1 returned SUCCESS for engine-v0.0.0, which is not published and never can be (bump.sh derives every pin from the released set). The installer cannot fail, so its green below would mean nothing."
            exit 1
          }
          Write-Host "armed: install.ps1 refused engine-v0.0.0"
          # The pwsh shell GitHub generates appends `exit $LASTEXITCODE`. A refusal that took the
          # `exit 1` branch would therefore red THIS step — the arm passing would read as the arm
          # failing. Clear it now that the verdict is recorded.
          $global:LASTEXITCODE = 0

      - name: Install the published Windows engine the way a user does (GATING)
        shell: pwsh
        env:
          # An explicit dir, not the default per-user Programs path: the assertion below has to
          # open the file the installer wrote, and `$env:LOCALAPPDATA\Programs\sift` is a path
          # this job would be restating rather than reading. No -Version — the baked pin IS the
          # thing under test (bump.sh owns that line, and `install.sh`/`src/sift-version.ts`
          # carry the same one).
          SIFT_INSTALL_DIR: ${{ github.workspace }}\sift-bin
        run: ./install.ps1

      - name: The installed binary must BE sift and must DIFF
        # Not `Test-Path`: a zero-byte file passes that. And not a meta-flag probe either — the
        # first draft of this step ran `--version`, which is how the missing-version-flag defect
        # was found: sift has NO version flag, so that probe reds on a perfectly good binary
        # while the three installer/showcase sites calling it swallowed the same error and
        # reported success. The lesson is in the choice made here: assert the PRODUCT ACT, not a
        # flag. Two logs in, a report out, exit 0 — what a user does one minute after installing.
        #
        # `--fail-on none` is explicit rather than relied upon: the default is `none`, but this
        # step must red on a broken engine and never on a significant diff, and writing it down
        # is what keeps a future default change from silently converting this into a flake.
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}\sift-bin\sift.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::install.ps1 reported success but wrote no $exe"; exit 1 }
          Set-Content -Path baseline.log -Value @('build start', 'compiling a.cpp', 'ok', 'build ok')
          Set-Content -Path changed.log  -Value @('build start', 'compiling a.cpp', 'error: a.cpp:3 undefined symbol', 'build failed')
          $out = & $exe baseline.log changed.log --format md --fail-on none 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the installed sift.exe exits $LASTEXITCODE on a plain two-log diff"; Write-Host $out; exit 1 }
          if ([string]::IsNullOrWhiteSpace($out)) { Write-Host "::error::the installed sift.exe produced an EMPTY report on a two-log diff"; exit 1 }
          Write-Host "the installed engine diffed two logs and wrote $($out.Length) chars of report"

  release:
    # THE MARKETPLACE MECHANISM. A Marketplace listing can only be republished from a
    # RELEASE — never from a tag. This repo had NO release job at all, and the cut
    # runbook's Sift wave (`OPS-1.S11`) pushed `main` and stopped, so twelve wrapper tags
    # shipped against exactly ONE Release (`v1.0.0`, 3 June) and the listing never moved.
    # The step was ABSENT, not silently failing: there was nothing to fail.
    #
    # WHY IT LIVES IN ci.yml AND NOT ITS OWN release.yml. The gate is then `needs:`, a fact,
    # instead of a `workflow_run` guess: the Release is created if and only if THIS tag's
    # build, actionlint, manifest-load and windows-install are all green. A second workflow on
    # the same `push: tags` trigger would have had to re-derive that verdict and would have
    # raced this one to the same Release object.
    #
    # `windows-install` joined that list when it was written: the Release is what publishes the
    # engine assets `install.ps1` downloads, so minting one while the documented Windows install
    # path is broken ships the defect to the surface that has no other check. It carries no
    # bootstrap circularity — the installer's pin names an ALREADY-published engine release
    # (bump.sh derives it from the released set), never the wrapper tag being cut here.
    #
    # It NEVER creates or moves a tag (`--verify-tag`), and it publishes nothing outward
    # that the Founder's tag push did not already authorise: the tag IS the cut decision
    # (ADR-2), this job is only its mechanical consequence.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, actionlint, manifest-load, windows-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/edit the Release on THIS repo — nothing else
    steps:
      - uses: actions/checkout@v5
        with:
          # The annotated tag OBJECT, not just the commit it points at: the release notes
          # are the tag message, which is where the Founder's cut sentence already lives.
          fetch-depth: 0

      - name: The tag and the manifest must declare the same version
        # `package.json` is the Action's own consumer-version declaration (`src/sift-version.ts`
        # documents the two independent lines and which one moves when). The workspace pin gate
        # holds it against `package-lock.json` (INV-9) and NOTHING has ever held it against the
        # tag. Measured 2026-08-19 across the wrapper series: `v1.5.0`…`v1.8.0` each shipped with
        # `package.json` reading `1.3.0`, and `v1.10.0` shipped reading `1.9.0`. A Release is a
        # public, effectively permanent object; it must not be minted against a tree that
        # contradicts its own version.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$pkg" ]; then
            echo "::error::tag $TAG but package.json declares $pkg — bump package.json, run 'npm install' so the lock follows (INV-9), then force-MOVE the tag. Refusing to mint a Release against a tree that contradicts it."
            exit 1
          fi
          echo "version coherence ✓ — $TAG == package.json $pkg"

      - name: Create the GitHub Release for this wrapper tag
        # Idempotent by construction, because the sanctioned recovery from a red cut is a
        # force-MOVE of the tag (never delete + recreate — a delete orphans the Release to a
        # DRAFT, and a draft is invisible to the Marketplace and to read-only tokens). On a
        # re-run the Release is already there and this only re-asserts `--draft=false`.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists (tag was force-moved, or this is a re-run) — re-asserting published."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          else
            # The notes ARE the annotated tag's message. One authored surface, written at the moment
            # of the cut, so the Marketplace entry cannot drift from the tag the way a committed
            # CHANGELOG would — and the tag message is already where the cut's consumer-facing prose
            # is written (`OPS-1.S11`).
            #
            # No generated-notes fallback, deliberately. `%(contents)` on a LIGHTWEIGHT tag does not
            # return empty — measured on v1.0.0, git falls back to the pointed COMMIT's message — so
            # a fallback keyed on emptiness would be plumbing with no reachable source. Blank here
            # means an annotated tag was pushed with an empty message, and a Marketplace entry with
            # an empty body is a defect on the product's front door, not a case to paper over.
            msg="$(git tag -l --format='%(contents)' "$TAG")"
            [ -n "$(printf '%s' "$msg" | tr -d '[:space:]')" ] || {
              echo "::error::tag $TAG carries no message — it would publish an empty Marketplace entry. Force-MOVE the tag with 'git tag -f -a $TAG -m \"…\"' (never delete: a delete orphans the Release to a draft)."; exit 1; }
            printf '%s\n' "$msg" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "Sift Action $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          # Assert the state, never assume it — a draft Release reads as success to the creator
          # and as "not found" to everyone else.
          is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          [ "$is_draft" = "false" ] || { echo "::error::Release $TAG is still a draft — the Marketplace cannot see it."; exit 1; }
          echo "Release $TAG published (isDraft=false) ✓"

  marketplace:
    # THE PROOF THE MECHANISM WORKED — measured, not assumed.
    #
    # Creating a Release is NECESSARY for the listing to advance. Whether it is SUFFICIENT is
    # not documented by GitHub, and the public evidence is split (measured 2026-08-19):
    #   · google-github-actions/auth advances on purely API-created releases — its `v3.0.0`,
    #     authored by a bot on 2025-08-28 through `gh`/the REST API, IS in its listing's
    #     release set. So the API path demonstrably can publish.
    #   · googleapis/release-please-action, also bot-authored, has been stuck at `v3.1.2`
    #     (2022) with every v4/v5 release absent from its listing — same manifest `name:`
    #     throughout, so the obvious explanations do not hold.
    # We therefore READ the listing instead of trusting either precedent. If the listing did
    # not take the new version, that is precisely the fact the cut needs, and reading the page
    # is the only way to obtain it.
    #
    # SEPARATE JOB on purpose: whether the Release object exists is one verdict and must not be
    # muddied by a Marketplace indexing delay or an outage. A red here does NOT invalidate the
    # Release — it says the LISTING still needs the manual "Publish this Action to the GitHub
    # Marketplace" checkbox on the release page, which is a Founder act, not a code defect.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions: {}   # reads a public page; needs no token at all
    steps:
      - name: The public listing must resolve this version
        env:
          TAG: ${{ github.ref_name }}
          # Derived from `action.yml`'s `name:` by GitHub, so it is not independently
          # discoverable. Pinned here rather than reconstructed, and the repo-identity
          # assertion below is what catches it if the name (and therefore the slug) ever moves.
          SLUG: sift-structural-ci-log-diff
        run: |
          set -euo pipefail
          url="https://github.com/marketplace/actions/$SLUG"
          page="$RUNNER_TEMP/listing.html"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sSL --retry 2 -o "$page" -w '%{http_code}' "$url" || echo 000)"
            if [ "$code" != "200" ]; then
              echo "attempt $attempt: HTTP $code"; sleep 30; continue
            fi
            # CONTROL FIRST. A "not found" from a probe whose subject moved is not a finding,
            # it is a broken instrument reporting one — so prove the page still carries the
            # payload we parse, and still describes OUR repo, before believing any absence.
            grep -qF '"releaseData":' "$page" || {
              echo "::error::$url no longer carries a releaseData payload — this probe is measuring nothing. Fix the probe; do not trust its verdict."; exit 1; }
            grep -qF 'CodeRoasted/sift-action' "$page" || {
              echo "::error::$url does not name CodeRoasted/sift-action — the slug moved (action.yml 'name:' changed?) or the listing detached. Re-derive SLUG."; exit 1; }
            if grep -qF "\"tagName\":\"$TAG\"" "$page"; then
              echo "Marketplace listing resolves $TAG ✓"
              exit 0
            fi
            echo "attempt $attempt: listing does not yet carry $TAG — waiting for the index."
            sleep 30
          done
          echo "::error::the Marketplace listing at $url still does not publish $TAG after ~3 min. The Release exists and @$TAG is usable; the LISTING did not advance. Open the release page and tick 'Publish this Action to the GitHub Marketplace' — then this job is the record that the API path alone is not enough for this listing."
          exit 1
