# The canonical baseline topology — "you are King of the baseline", with a
# sensible default already wired and ZERO plumbing in your build job.
#
# Your build job stays exactly as it is. Optionally, bracket the region you
# want diffed with capture markers (plain echoed lines):
#
#     echo "TAMYS_CAPTURE ci"        # open a named section
#     make ci                       # ... anything ...
#     echo "TAMYS_CAPTURE_END"       # close it
#
# No markers ⇒ Tamys diffs the whole job log. Either way, the `tamys` job below
# pulls the finished build job's log straight off the GitHub API
# (`target-job: build`) — no tee, no artifact hand-off, no shell changes.
#
# What the topology does:
#   * push to main / tag on main  → diff vs the NAMED main baseline
#                                   (`tamys-baseline-main-ci`), then re-seed it
#                                   (green-gated: a red build never overwrites it).
#   * PR into main                → TWO diffs: this build vs the main baseline
#                                   (the sticky comment), AND this build vs the
#                                   PR's own previous run (its own tagged
#                                   comment); then seed the per-PR baseline for
#                                   the next push to this PR.
#
# Named baselines resolve repo-wide by artifact name, so the tag/PR diffs work
# even though tags have no branch and PRs never ran on main. If your CI is
# `workflow_call`-ed from a release workflow at tag time, that run inherits the
# tag event and seeds the main baseline — no extra trigger needed. Every knob —
# source, names, seeding, capture, run-conditions — is an input; override at will.
#
# A second lineage from the same job (e.g. a release-packaging phase)? Bracket it
# with `TAMYS_CAPTURE release` … `TAMYS_CAPTURE_END` and add one more tamys step
# with `capture: release` + its own `baseline-name` (+ `comment-tag`).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Your real build — unchanged. Markers are optional precision, not plumbing.
      - name: Build + test
        run: |
          echo "TAMYS_CAPTURE ci"
          make ci
          echo "TAMYS_CAPTURE_END"

  tamys:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write        # read the build job's log + baselines; upload this run's baseline
      pull-requests: write  # the sticky PR comment(s)
    steps:
      # ── main push / tag: diff vs the named main baseline, then re-seed it ──
      - name: Tamys — vs main baseline (and re-seed it)
        if: ${{ github.event_name == 'push' }}
        uses: CodeRoasted/sift-action@v2
        with:
          target-job: build
          baseline: artifact=tamys-baseline-main-ci
          baseline-name: tamys-baseline-main-ci       # publish back under the same name
          baseline-max-age: 72h                      # the shipped default, stated for clarity: a red streak stops the re-seed,
                                                     # and past this the diff announces its staleness (a warning) instead of
                                                     # silently aging. Raise it if your trunk is quieter than daily.
          # publish-baseline: auto → verdict-gated re-seed (a FAILURE/UNSTABLE/ABORTED/CANCELLED push keeps the old baseline)
          # changed-outcome: auto → the build job's own native conclusion, forwarded to the engine

      # ── PR: ① this build vs main (the headline sticky comment) ──
      - name: Tamys — vs main baseline
        if: ${{ github.event_name == 'pull_request' }}
        uses: CodeRoasted/sift-action@v2
        with:
          target-job: build
          baseline: artifact=tamys-baseline-main-ci
          baseline-max-age: 72h                      # same bound as the seeding leg — a PR must not silently diff against a stale main
          publish-baseline: never                    # ② below owns this PR's seeding

      # ── PR: ② this build vs this PR's previous run (its own tagged comment),
      #        then seed the per-PR baseline for the next push ──
      - name: Tamys — vs previous run of this PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: CodeRoasted/sift-action@v2
        with:
          target-job: build
          baseline: artifact=tamys-baseline-ci-pr-${{ github.event.number }}
          baseline-name: tamys-baseline-ci-pr-${{ github.event.number }}
          baseline-max-age: ''                       # deliberately UNBOUNDED: a per-PR baseline legitimately ages
                                                     # between pushes, so the 72h default would only manufacture noise
          comment-tag: vs-previous-run
          pr-comment: drift                          # quiet unless something moved since the last push
