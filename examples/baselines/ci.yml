# The canonical baseline topology — "you are King of the baseline", with a
# sensible default already wired and ZERO plumbing in your build job.
#
# Your build job stays exactly as it is. Optionally, bracket the region you
# want diffed with capture markers (plain echoed lines):
#
#     echo "SIFT_CAPTURE ci"        # open a named section
#     make ci                       # ... anything ...
#     echo "SIFT_CAPTURE_END"       # close it
#
# No markers ⇒ Sift diffs the whole job log. Either way, the `sift` job below
# pulls the finished build job's log straight off the GitHub API
# (`target-job: build`) — no tee, no artifact hand-off, no shell changes.
#
# What the topology does:
#   * push to main / tag on main  → diff vs the NAMED main baseline
#                                   (`sift-baseline-main-ci`), then re-seed it
#                                   (green-gated: a red build never overwrites it).
#   * PR into main                → TWO diffs: this build vs the main baseline
#                                   (the sticky comment), AND this build vs the
#                                   PR's own previous run (its own tagged
#                                   comment); then seed the per-PR baseline for
#                                   the next push to this PR.
#
# Named baselines resolve repo-wide by artifact name, so the tag/PR diffs work
# even though tags have no branch and PRs never ran on main. If your CI is
# `workflow_call`-ed from a release workflow at tag time, that run inherits the
# tag event and seeds the main baseline — no extra trigger needed. Every knob —
# source, names, seeding, capture, run-conditions — is an input; override at will.
#
# A second lineage from the same job (e.g. a release-packaging phase)? Bracket it
# with `SIFT_CAPTURE release` … `SIFT_CAPTURE_END` and add one more sift step
# with `capture: release` + its own `baseline-name` (+ `comment-tag`).

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Your real build — unchanged. Markers are optional precision, not plumbing.
      - name: Build + test
        run: |
          echo "SIFT_CAPTURE ci"
          make ci
          echo "SIFT_CAPTURE_END"

  sift:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write        # read the build job's log + baselines; upload this run's baseline
      pull-requests: write  # the sticky PR comment(s)
    steps:
      # ── main push / tag: diff vs the named main baseline, then re-seed it ──
      - name: Sift — vs main baseline (and re-seed it)
        if: ${{ github.event_name == 'push' }}
        uses: CodeRoasted/sift-action@v1
        with:
          target-job: build
          baseline: artifact=sift-baseline-main-ci
          baseline-name: sift-baseline-main-ci       # publish back under the same name
          # publish-baseline: auto → green-gated re-seed (a red push keeps the old baseline)
          build-status: ${{ needs.build.result == 'success' && 'green' || 'red' }}

      # ── PR: ① this build vs main (the headline sticky comment) ──
      - name: Sift — vs main baseline
        if: ${{ github.event_name == 'pull_request' }}
        uses: CodeRoasted/sift-action@v1
        with:
          target-job: build
          baseline: artifact=sift-baseline-main-ci
          publish-baseline: never                    # ② below owns this PR's seeding
          build-status: ${{ needs.build.result == 'success' && 'green' || 'red' }}

      # ── PR: ② this build vs this PR's previous run (its own tagged comment),
      #        then seed the per-PR baseline for the next push ──
      - name: Sift — vs previous run of this PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: CodeRoasted/sift-action@v1
        with:
          target-job: build
          baseline: artifact=sift-baseline-ci-pr-${{ github.event.number }}
          baseline-name: sift-baseline-ci-pr-${{ github.event.number }}
          comment-tag: vs-previous-run
          pr-comment: significant                    # quiet unless something moved since the last push
          build-status: ${{ needs.build.result == 'success' && 'green' || 'red' }}
