# Fork-safe Sift — 1 of 2: UNPRIVILEGED build + render.
#
# Runs on EVERY PR, including from forks. It has a READ-ONLY token (no
# pull-requests: write, no secrets), so even though it builds the PR's (possibly
# fork-controlled) code, it cannot post a comment or touch anything privileged.
# It renders the Sift comment body to an artifact; the poster (2 of 2) posts it.
#
# Requires sift-action's `render` mode (arms with fork-comment support, contract §6.1).
name: Sift (build + render)

on:
  pull_request:

permissions:
  contents: read          # checkout only — NO pull-requests: write in this fork-exposed job
  actions: read           # read-only: resolve the base branch's last-green run + its baseline
                          # artifact. Still no WRITE in this fork-exposed job; a fork's restricted
                          # token may 403 on these reads anyway → the Action cold-starts gracefully.

jobs:
  sift-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: build
        continue-on-error: true                      # a red build must still render — don't fail the job here,
                                                     # or the workflow_run poster (2 of 2) never fires
        run: |
          set -o pipefail                            # `| tee` must not mask the build's real exit code,
                                                     # or changed-outcome below is always (wrongly) success
          ./ci/build.sh 2>&1 | tee build.log         # your build; produces the log to diff

      - uses: CodeRoasted/sift-action@v1
        with:
          log: build.log
          mode: render                               # compute the body to an artifact dir; never post
          changed-outcome: ${{ steps.build.outcome }} # the NATIVE step token, verbatim — the engine maps it
          # Inline check-run annotations surface from THIS unprivileged job — they are stdout
          # workflow commands (no write token), so they appear on the fork PR's checks even though
          # the sticky comment waits for the privileged poster (2 of 2). Default `significant`;
          # set `annotations: never` to opt out.

      # render mode writes the comment body + PR metadata under ${{ runner.temp }}/sift-comment/.
      - uses: actions/upload-artifact@v4
        with:
          name: sift-comment
          path: ${{ runner.temp }}/sift-comment/
          if-no-files-found: error
